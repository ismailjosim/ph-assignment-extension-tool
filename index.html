<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tools - Assignment Checking Extension</title>

  <link rel="stylesheet" href="./tools.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <style>
    body {
      font-family: "Plus Jakarta Sans", sans-serif;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 w-80 p-4 select-none min-h-[360px] flex flex-col justify-between">
  <!-- Header -->
  <div>
    <div class="flex items-center justify-between pb-3 border-b border-slate-800/80">
      <div class="flex items-center gap-2.5">
        <div
          class="w-8 h-8 rounded-xl bg-gradient-to-tr from-violet-600 to-pink-500 flex items-center justify-center text-sm shadow-md shadow-violet-500/30">
          🔥
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-tight text-white leading-tight">Instructor Tools</h1>
          <p class="text-[11px] text-slate-400">Assignment Checker</p>
        </div>
      </div>
      <span
        class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        Ready
      </span>
    </div>

    <!-- Quick Status & Instructions -->
    <div
      id="toggle-tools-btn"
      class="mt-3 p-3 rounded-xl bg-slate-900/90 border border-slate-800/80 space-y-2 cursor-pointer hover:border-violet-500/50 hover:bg-slate-900 transition-all select-none"
      title="Click to toggle toolbar"
    >
      <div class="flex items-center justify-between text-xs">
        <span class="text-slate-400">Toggle Toolbar</span>
        <kbd
          class="px-2 py-0.5 rounded-md bg-slate-800 text-violet-300 font-mono text-[11px] border border-slate-700/80 shadow-inner">
          _ (underscore)
        </kbd>
      </div>
      <div class="text-[11px] text-slate-400 flex items-center gap-1.5">
        <span>✨</span>
        <span>Click here or press _ to show / hide toolbar</span>
      </div>
    </div>

    <!-- Shortcuts Reference Card -->
    <div class="mt-3">
      <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2">
        Keyboard Shortcuts
      </div>
      <div class="grid grid-cols-2 gap-1.5 text-xs">
        <div class="p-2 rounded-lg bg-slate-900/60 border border-slate-800/60 flex items-center justify-between">
          <span class="text-slate-300 text-[11px]">Open & Links</span>
          <kbd class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 font-mono text-[10px]">↑ Up</kbd>
        </div>
        <div class="p-2 rounded-lg bg-slate-900/60 border border-slate-800/60 flex items-center justify-between">
          <span class="text-slate-300 text-[11px]">Close Modal</span>
          <kbd class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 font-mono text-[10px]">↓ Down</kbd>
        </div>
        <div class="p-2 rounded-lg bg-slate-900/60 border border-slate-800/60 flex items-center justify-between">
          <span class="text-slate-300 text-[11px]">Focus & Copy</span>
          <kbd class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 font-mono text-[10px]">← Left</kbd>
        </div>
        <div class="p-2 rounded-lg bg-slate-900/60 border border-slate-800/60 flex items-center justify-between">
          <span class="text-slate-300 text-[11px]">Submit Mark</span>
          <kbd class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 font-mono text-[10px]">→ Right</kbd>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
    <span>Version 2.1.0</span>
    <span title="ISMAIL JOSIM, SHAKIL & FARHAN">Made with ❤️🔥 for Instructors</span>
  </div>

  <!-- Scripts for preview and extension -->
  <script src="./js/buttons.js"></script>
  <script src="display.js"></script>
  <script src="./js/github.js"></script>
  <script src="./js/meet.js"></script>
  <script src="./js/liveSite.js"></script>
  <script src="./js/instructorPortal.js"></script>
  <script src="app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("toggle-tools-btn");
      if (btn) {
        btn.addEventListener("click", () => {
          if (typeof window.toggleTools === "function") {
            window.toggleTools();
          }
        });
      }
    });
  </script>
</body>

</html>
